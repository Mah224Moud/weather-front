<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
/>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<nav
  class="navbar navbar-expand-lg bg-gradient-to-r from-cyan-500 to-blue-500 border-0"
>
  <div class="container-fluid">
    <a href="/" class="navbar-brand d-flex align-items-center">
      <img
        src="/assets/img/logo/logo-meteo.png"
        class="logo-img"
        alt="Logo Météo"
      />
      <span class="ms-3 text-brand">iMétéo</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarTogglerDemo01"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 mx-auto">
        <li class="nav-item">
          <a href="/data-consultation" class="nav-link"
            >Consultation des données</a
          >
        </li>
        <li class="nav-item">
          <a href="/visualization" class="nav-link">Visualisations</a>
        </li>
        <li class="nav-item">
          <a href="/interfacemeteo" class="nav-link">Météo</a>
        </li>
        <li *ngIf="isLoggedIn" class="nav-item">
          <a href="/llm" class="nav-link">LLM</a>
        </li>
        <li class="nav-item">
          <a href="/arome" class="nav-link">AROME</a>
        </li>
      </ul>

      <div class="connexion ms-auto">
        <a
          *ngIf="isLoggedIn; else loginTemplate"
          class="btn btn-outline-primary px-4"
          (click)="logout()"
          >Déconnexion</a
        >
        <ng-template #loginTemplate>
          <a href="/login" class="btn btn-outline-primary px-4">Connexion</a>
        </ng-template>
      </div>
    </div>
  </div>
</nav>

<p class="container py-2 px-5 text-muted d-flex justify-content-end">
  Bonjour, {{ userInfo.nom.toUpperCase() }} {{ userInfo.prenom }}
</p>

<router-outlet></router-outlet>
